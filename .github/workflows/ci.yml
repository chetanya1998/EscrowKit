name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.5.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client (Indexer)
        working-directory: packages/indexer
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Generate Prisma Client (API)
        working-directory: packages/api
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Build Contracts Artifacts (Required for Protocol Generation)
        working-directory: packages/contracts
        run: forge build

      - name: Verify Protocol Generation
        run: |
          pnpm --filter @escrowkit/protocol generate
          git diff --exit-code packages/protocol/src/generated.ts

      - name: Build
        run: pnpm build

      - name: Test Contracts
        run: |
          cd packages/contracts
          forge test

      - name: Test API
        run: pnpm --filter api test

      - name: Typecheck Dapp
        run: pnpm --filter dapp typecheck

      - name: Test Dapp
        run: pnpm --filter dapp test
